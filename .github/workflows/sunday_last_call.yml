name: Sunday last call — weekend refresh tripwire

# Closes the weekend tripwire gap (2026-07-25). The freshness tripwire
# rides the pipeline workflows — daily_live_track.yml (Mon-Fri 21:30
# UTC) and weekly_factsheet.yml (Fri 22:00 UTC) — so between Friday
# 22:00 UTC and Monday 21:30 UTC no tripwire-bearing run exists. A
# missed weekend refresh_all.py (the ~4.3-hour local job that advances
# data/breadth_csp1.json, normally run each Saturday) therefore first
# surfaced as Monday's hard-stop [FAIL], after the remediation window
# had closed rather than before. This workflow is the Sunday last call:
# one scheduled check inside the gap, emailing ONLY when the panel is
# already in the state that will abort Monday's run.
#
# Why the email condition is status == 'fail', not the daily's
# warn == 'true': on a Sunday clock the weekly cadence is bimodal. A
# Saturday-refreshed panel ends Friday and shows weekday-lag 1 (ok —
# silent); a panel still ending the PREVIOUS Friday shows lag 6, past
# the 5-weekday budget — exactly the missed-weekend signature, and the
# state in which Monday 21:30 UTC aborts. Warn-band states (lag 4-5)
# can appear on a Sunday only from mid-week panel ends, and each of
# those still has at least one tripwire-bearing weekday run ahead of
# its own hard stop, so the existing daily [REMINDER]/[WARN] path
# covers them and this workflow stays silent. A Sunday email means act
# today. The checker reports its own internal errors as status 'fail'
# (fail-safe towards alerting), so an unreadable panel also emails.
#
# Why Sunday 09:00 UTC (17:00 SGT): a full day after the normal
# Saturday refresh slot, so the healthy cadence never sees this email;
# early enough to leave Sunday evening plus all of Monday SGT (~36
# hours) for the ~4.3-hour refresh before the Monday 21:30 UTC hard
# stop. GitHub fires crons late (measured up to ~4h on this repo — see
# sentinel.yml), but the verdict here is date-based, not time-based:
# any start on the Sunday clock returns the same answer, so the delay
# tail costs notice hours, never correctness.
#
# Deliberately a separate workflow from sentinel.yml: the sentinel is
# outside-in (fetches the DEPLOYED site, shares no state with the
# pipeline) and must stay that way. This check is inside-in (reads the
# committed panel) — the same family as the tripwire steps in the
# pipeline workflows, on a schedule they cannot cover.

on:
  schedule:
    # Sunday 09:00 UTC = 17:00 SGT (SGT is fixed UTC+8, no DST).
    - cron: '0 9 * * 0'
  workflow_dispatch:  # manual trigger button

permissions:
  contents: read

jobs:
  last-call:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lag-arithmetic dependency
        # Deliberately NOT the full requirements.txt: the check needs
        # numpy alone (regime_publish's busday arithmetic) and must
        # stay fast and independent of the pipeline environment —
        # same rationale as the sentinel's minimal install.
        run: pip install numpy

      # No continue-on-error here, unlike the pipeline workflows: there
      # is no build to protect, and a swallowed step failure would leave
      # empty outputs, the email condition false, and the tripwire
      # silent — the failure alert below must fire instead.
      - name: Check breadth_csp1 freshness headroom
        id: headroom
        run: python scripts/check_freshness_headroom.py

      - name: Email last call (panel would abort Monday's run)
        if: steps.headroom.outputs.status == 'fail'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[${{ steps.headroom.outputs.tag }}] Dashboard freshness — Sunday last call — ${{ steps.headroom.outputs.summary }}'
          # Ops alerts go to the operator only, NOT RECIPIENT_EMAIL — the
          # factsheet distribution list should not receive plumbing email.
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.headroom.outputs.detail }}

            Sunday last call: the weekend panel refresh has not landed.
            Unless a local refresh (python scripts/refresh_all.py,
            about 4.3 hours, then commit and push) lands before the
            first failing run named above, that run aborts at the
            freshness guard and the dashboard freezes at its last
            as-of.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ----- Failure alert (2026-07-25) -----
      # The tripwire must not fail silently: if the job dies before the
      # check reports (checkout, install, runner), the missed-weekend
      # state it exists to catch would surface only at Monday's hard
      # stop — the exact outcome this workflow pre-empts. The script
      # covers its own internal errors (status 'fail'); this covers
      # failures upstream of the script. Under a healthy cadence with a
      # working runner this workflow sends nothing at all.
      - name: Email failure alert
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[WARN] Sunday last call could not run — check breadth_csp1 freshness manually'
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            The Sunday last-call tripwire failed before the freshness
            check could report — the state it exists to catch (a missed
            weekend refresh) may be present and unannounced. Verify
            manually:

              python scripts/check_freshness_headroom.py

            If data/breadth_csp1.json still ends at the previous
            Friday, run python scripts/refresh_all.py (about 4.3
            hours), then commit and push before Monday 21:30 UTC
            (Tuesday 05:30 SGT).

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
