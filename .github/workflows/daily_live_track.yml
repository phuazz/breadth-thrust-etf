name: Daily live mark-to-market

# Runs Mon-Fri at 21:30 UTC (after US market close, before Tokyo open).
#
# What this does (and does NOT do):
#   - DOES: refresh data/live_track.json with mark-to-market NAV points
#     for the current week's holdings against today's closing prices.
#   - DOES: rebuild docs/index.html so the WTD hero card and Performance
#     chart show up-to-date intra-week NAV.
#   - DOES NOT: re-run signal generation, walk-forward K refit,
#     bootstrap CIs, or right-tail metrics. Those are weekly concerns;
#     re-running them daily would burn workflow minutes for no
#     informational gain (the answer barely changes day-to-day).
#
# The weekly_factsheet.yml workflow remains the source of truth for
# the full backtest + signals + factsheet. This workflow only extends
# the deployed blend equity through the current week — the Friday
# anchor itself is re-established when the weekend local refresh lands
# (weekly_factsheet.yml is push-triggered by that refresh commit since
# 2026-07-25; it no longer runs on a Friday cron).
#
# Typical run time: 1-2 minutes (yfinance fetch for ~17 tickers + 2 FX
# pairs + a pipeline rebuild). The factsheet PDF is rebuilt too so the
# Pages-published PDF is also current.

on:
  schedule:
    # Mon-Fri 21:30 UTC = early morning SGT next day (after US close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # manual trigger button

permissions:
  contents: write

jobs:
  mark-to-market:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----- Freshness early warning (2026-07-03; tiered 2026-07-25) -----
      # The pipeline's hard guard aborts every build once breadth_csp1.json
      # lags the run date by more than 5 weekdays — by which point the
      # dashboard is already frozen (the 26 Jun - 1 Jul outage gave no
      # notice at all). This step emails from weekday-lag 4, one to two
      # runs BEFORE the hard stop, naming the exact run that will fail and
      # the local remediation. It never blocks the build: the script
      # always exits 0 and the step is continue-on-error besides.
      #
      # Subject tiering (2026-07-25): under the normal weekly cadence the
      # panel ends EVERY week at lag 4-5 by Thu/Fri, so those alerts
      # describe a healthy steady state. The script tags them [REMINDER]
      # (warn band with a weekend day still ahead of the first failing
      # run — the routine weekend refresh window remains open) and
      # reserves [WARN] for mid-week staleness, the hard stop, or a
      # checker error. Deadlines and thresholds are unchanged.
      - name: Check breadth_csp1 freshness headroom
        id: headroom
        continue-on-error: true
        run: python scripts/check_freshness_headroom.py

      - name: Email freshness warning (warn-early, before the hard stop)
        if: steps.headroom.outputs.warn == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[${{ steps.headroom.outputs.tag }}] Dashboard freshness — ${{ steps.headroom.outputs.summary }}'
          # Ops alerts go to the operator only, NOT RECIPIENT_EMAIL — the
          # factsheet distribution list should not receive plumbing email.
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.headroom.outputs.detail }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Run daily mark-to-market overlay
        run: python scripts/mark_to_market_live.py

      # ----- Capture integrity (2026-07-03) -----
      # A run can succeed while the fetch quietly captured nothing new
      # (partial yfinance response, cached feed) or a corrupt print — the
      # silent-wrong class no process-level check sees. This anchors the
      # series THIS job just refreshed (live track only — B/C are weekly-
      # cadence by design) to the true NYSE calendar: 1 session behind
      # emails a warning and still publishes (cadence rule: publish the
      # latest populated close); 2+ behind or a corrupt tail FAILS the
      # job before anything is built or committed.
      - name: Check capture integrity (live track vs NYSE calendar)
        id: capture
        run: python scripts/check_capture_integrity.py --targets live

      - name: Email capture warning (1 session behind, still publishing)
        if: steps.capture.outputs.capture_warn == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[WARN] Capture lag — ${{ steps.capture.outputs.summary }}'
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.capture.outputs.detail }}

            The run continues and publishes the latest populated close.
            If this repeats tomorrow, the upstream feed is stuck — the
            2-session threshold will then fail the job.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # The dashboard rebuilds daily, but the holdings 1Y price series (which
      # feeds the Monitor click-expand mini-charts) was only refreshed in the
      # weekly factsheet workflow. Its Data Health budget is daily (warn 3 /
      # stale 7), so 3+ days after each weekly run the feed chronically flagged
      # "approaching". The export is cache-first and now self-heals from
      # yfinance for any book ticker whose (gitignored) cache is absent on the
      # runner, so it is cheap and safe to refresh daily. Soft-fail so a feed
      # hiccup never blocks the live-track publish.
      # Soft-fail EXCEPT exit 2, an unrepaired regression: a ticker's series
      # ended earlier than the published panel and the re-fetch could not
      # restore it. That is a data-integrity fault, not a feed hiccup, and it
      # must stop the job before the commit step — on 2026-08-08 a run wrote
      # EEM (10.0% of NAV) four sessions backwards and committed it under a
      # message asserting every panel was current. A bare `|| true` here would
      # swallow that exit code, which is why the guard is not simply trusted
      # to fail on its own.
      # ----- Cross-feed anchor consistency (2026-08-10) -----
      # Capture integrity anchors series to the calendar, so it is satisfied
      # whenever the DATES are right. It cannot see a restatement, where the
      # dates hold still and the VALUES move. The 2026-08-10 survivorship
      # restatement moved the deployed curve while live_track.json kept the
      # pre-restatement anchor for ~36h, and the page published both: 2.9177 in
      # the strategy block against 3.0517 in the live track, the same curve on
      # the same date, 4.6% apart. This compares the two feeds directly and
      # fails BEFORE the dashboard rebuild below, so a split vintage is never
      # baked into a published artefact. Placed after the capture-warning email
      # so that alert still fires when both conditions land in one run.
      - name: Check anchor consistency (live track vs deployed curve)
        run: python scripts/check_anchor_consistency.py

      - name: Run holdings price export (soft-fail, except a backwards panel)
        run: |
          set +e
          python scripts/export_holdings_prices.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::holdings price panel went BACKWARDS — refusing to publish"
            exit 1
          fi
          exit 0

      # The verdict inside strategy_freshness.json expires against the clock:
      # every row compares the data bound to the venue's last close AT THE
      # MOMENT IT WAS COMPUTED, so once a venue closes again the stored answer
      # is confidently wrong rather than merely old. Only refresh_all.py wrote
      # it, and that is a local manual run — so the report committed on Sun
      # 2026-08-23 published "all four sleeves current" over a book a session
      # behind from Monday's close until Tuesday. Recomputing it here, in the
      # unattended path, is what keeps it true between local refreshes. It
      # reads artefacts off disk and fetches nothing, so it describes the state
      # THIS run is about to publish. Must precede the two page builds below.
      #
      # Soft-failed on purpose: this is one strip on the dashboard, not the
      # book, and _load_freshness is explicit that a missing report should not
      # stop the page publishing. If it does fail, verdict_has_lapsed withholds
      # the strip on the next build rather than letting a stale one through —
      # the widget goes blank, which is visible, instead of wrong, which is not.
      - name: Recompute per-sleeve data freshness
        continue-on-error: true
        run: python scripts/strategy_freshness.py

      - name: Rebuild dashboard + factsheet with live extension
        run: python scripts/pipeline.py

      # build/portfolio.html is the reduced public page, published from the
      # separate phuazz/portfolio repo, which pulls this file. It reads the same
      # live_track/risk_overlay pair the dashboard does, so it is rebuilt in the
      # same breath — a public page that silently stops refreshing is worse than
      # no public page. Deliberately NOT soft-failed: every condition that stops
      # this build (weights not summing to NAV, a holding with no sleeve, a
      # holdings date that disagrees with the price date) is a fault in the
      # book's own state, not a fault in the reduced view of it.
      - name: Rebuild public portfolio page
        run: python scripts/build_simple_page.py

      - name: Run regression tests
        run: python -m pytest tests/ -q

      # ----- Hard-fail publish push (2026-08-13, external review F1) -----
      # A rejected push previously fell through a soft fallback and left the
      # job green, so the failure alert below never fired while the live
      # track froze — and the sentinel only watches factsheet_meta.json, not
      # this surface. Rebase-then-retry (same pattern as scanner-daily and
      # universe_monitor; --autostash because tracked build outputs may be
      # dirty mid-job) since another workflow may push between checkout and
      # here; exhaustion goes loudly red so the alert fires.
      #
      # build/portfolio.html is staged EXPLICITLY (2026-08-16). The step above
      # rebuilt it, the pytest step above passed against it, and then this add
      # threw it away — build/ was in neither this list nor the weekly one, so
      # the reduced public page had only ever reached main by hand. It went
      # unseen because both workflows rebuild before they test: the runner's
      # copy is always fresh, and only the standalone Tests workflow, which
      # checks out committed state, can see the drift. It caught it on 759eb6c.
      # Explicit path rather than `build/`, for the reason scanner-daily gives.
      - name: Commit refreshed outputs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Daily Live Track Bot"
          git add data/live_track.json data/ docs/ build/portfolio.html
          if git diff --cached --quiet; then
            echo "No refreshed outputs to commit."
            exit 0
          fi
          git commit -m "Daily live track refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::Could not push refreshed outputs after 3 attempts."
          exit 1

      # ----- Failure alert (2026-07-03) -----
      # Four consecutive scheduled failures (26 Jun - 1 Jul) went unseen
      # for a week because nothing emailed. if: failure() fires when any
      # earlier step failed, so a frozen dashboard is now loud.
      - name: Email failure alert
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[FAIL] Daily live track did not publish — dashboard frozen at last as-of'
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            The scheduled daily mark-to-market run failed. The deployed
            dashboard stays at its last committed as-of until a run
            succeeds.

            If the log shows the breadth_csp1 freshness guard, the fix is
            local: python scripts/refresh_all.py, then commit and push,
            then start a NEW run via the 'Run workflow' button. Do NOT
            use 'Re-run failed jobs' after a refresh - it re-runs the
            original commit without the refreshed panels and hits the
            same guard again.

            For transient failures (network, yfinance), 'Re-run failed
            jobs' is fine - same commit, same inputs, likely to pass.

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
