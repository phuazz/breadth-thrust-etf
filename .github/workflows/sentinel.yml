name: Deployed-dashboard sentinel

# Outside-in verification (2026-07-03). The pipeline workflows verify
# their own process; this workflow verifies the OUTCOME: it fetches the
# LIVE GitHub Pages site and checks the published as-of against the
# NYSE calendar, sharing no state with the pipeline. It exists for the
# silent class — a run that succeeds while publishing wrong or stale
# data — which no amount of in-run guarding can fully exclude.
#
# Schedule: daily 03:35 UTC (11:35 SGT).
#
# Why so long after the 21:30/22:00 UTC publishes: GitHub fires
# scheduled crons late, and the buffer must absorb the DELAY TAIL, not
# the average. Measured on this repo (2026-06/07): daily starts 22:29
# to 23:15 (59-105 min late); the old Saturday 02:00 slot fired up to
# 4h17m late (06:17 start, 2026-06-13). At 03:35 UTC the sentinel keeps
# more than an hour of buffer even against a 4h20m-delayed publish,
# while the verdict it checks is unchanged — the expected session only
# advances at the NEXT market close (20:00 UTC). Never move this
# earlier than ~02:30 UTC; a false [SENTINEL] alarm from a slow cron
# would train the operator to ignore the one email that must be read.
#
# Daily cadence (all 7 days): each run validates the last completed
# session as of its own run time — Tue validates Mon, Sat validates
# Fri (factsheet night), Sun and Mon revalidate Fri, which confirms a
# Saturday-morning manual recovery and keeps nagging if nothing was
# fixed. An unchanged weekend costs two trivially-green 1-minute runs.

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install calendar dependency
        # Deliberately NOT the full requirements.txt: the sentinel must
        # stay independent of the pipeline's environment and fast.
        run: pip install "pandas_market_calendars>=4.4"

      - name: Check deployed as-of against the NYSE calendar
        run: python scripts/sentinel_check.py

      - name: Email sentinel alert
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[SENTINEL] Live dashboard as-of does not match the NYSE calendar'
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            The deployed site at
            https://phuazz.github.io/breadth-thrust-etf/ is not showing
            the as-of date the NYSE calendar says it should.

            If a [FAIL] email also arrived tonight, this confirms the
            outage reached the public site - fix per that email. If NO
            failure email arrived, a run went green while publishing
            wrong or stale data: run the VERIFY_DASHBOARD.md audit to
            localise where the chain diverged.

            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
