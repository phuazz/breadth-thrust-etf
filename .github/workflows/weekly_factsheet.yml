name: Weekly factsheet — pipeline + email

# Runs every Saturday at 02:00 UTC (Friday US market close has settled).
# Refreshes all pipeline outputs (sleeves, blend, overlay, dashboard,
# factsheet PDF), commits the updated docs/ + data/ back to main, and
# emails the factsheet PDF to the configured recipient.
#
# Manual trigger also enabled via workflow_dispatch.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   GMAIL_USER          - Gmail address used to send (e.g. phuazz@gmail.com)
#   GMAIL_APP_PASSWORD  - 16-char Gmail app password (not the account
#                          password — generate at https://myaccount.google.com/apppasswords)
#   RECIPIENT_EMAIL     - Where the factsheet goes (e.g. phuazz@gmail.com)

on:
  schedule:
    # Saturday 02:00 UTC = Saturday 10:00 SGT (after Friday US close has settled)
    - cron: '0 2 * * 6'
  workflow_dispatch:  # manual trigger button in Actions tab

permissions:
  contents: write  # needed to commit refreshed data + docs back to main

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Fallback install — matches the local dev environment
            pip install pandas numpy matplotlib yfinance pyarrow \
                        pandas-market-calendars requests pytest
          fi

      - name: Refresh constituent rosters (Strategy A + D)
        # Touch the iShares CSVs so the rolling Friday snapshots are
        # current. Soft-fail if iShares is rate-limiting — the rest of
        # the pipeline can run on cached data.
        run: |
          set -e
          for etf in SOXX CSP1 CNDX IUES IUFS IUHC IUIS IUCS IUCD IUUS IUMS IUCM IUSP IDP6 EXV1 EXH1 EXV3 EXH3 EXH9; do
            python scripts/fetch_constituents.py --etf "$etf" || echo "WARN: $etf fetch failed; continuing on cached snapshot"
          done

      - name: Run breadth pipelines (Strategy A + D, per ETF)
        run: |
          set -e
          for etf in SOXX CSP1 CNDX IUES IUFS IUHC IUIS IUCS IUCD IUUS IUMS IUCM IUSP IDP6 EXV1 EXH1 EXV3 EXH3 EXH9; do
            python scripts/compute_breadth.py --etf "$etf"
          done

      - name: Run robustness + Strategy A engine
        run: python scripts/run_topk_robustness.py

      - name: Run Strategy B (asset-class rotation)
        run: python scripts/run_asset_class_rotation.py

      - name: Run Strategy C (thematic rotation)
        run: python scripts/run_thematic_rotation.py

      - name: Run Strategy D (Europe rotation)
        run: python scripts/run_europe_rotation.py

      - name: Run multi-strategy blend
        run: python scripts/run_multi_strategy.py

      - name: Run Phase 19 + 22 risk overlay
        run: python scripts/run_risk_overlay.py

      - name: Run holdings price export (for dashboard mini-charts)
        run: python scripts/export_holdings_prices.py || true

      - name: Build dashboard + factsheet
        run: python scripts/pipeline.py

      - name: Run regression tests
        run: python -m pytest tests/ -q

      - name: Commit refreshed outputs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Weekly Factsheet Bot"
          git add data/ docs/ || true
          # Soft-fail if nothing changed (rare — usually data files refresh)
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
          git push origin main || echo "Nothing to push"

      - name: Compute as-of date for email subject
        id: meta
        run: |
          ASOF=$(python -c "import json; d=json.loads(open('data/multi_strategy.json').read()); s=d['strategies'].get('blend_35_35_10_20_gated_eem_tilted') or d['strategies']['blend_35_35_10_20']; print(s['dates'][-1])")
          echo "asof=${ASOF}" >> $GITHUB_OUTPUT

      - name: Email factsheet PDF
        # Uses dawidd6/action-send-mail (well-maintained, SMTP-based,
        # supports attachments).
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 'Weekly factsheet · USD Multi-Strategy ETF Portfolio · ${{ steps.meta.outputs.asof }}'
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: 'USD Multi-Strategy ETF Factsheet <${{ secrets.GMAIL_USER }}>'
          html_body: |
            <h2>Weekly factsheet — USD Multi-Strategy ETF Portfolio</h2>
            <p>As of <strong>${{ steps.meta.outputs.asof }}</strong>.</p>
            <p>The attached one-page PDF covers:</p>
            <ul>
              <li>Current breadth regime + EEM tilt state</li>
              <li>Multi-period returns vs SPY benchmark</li>
              <li>Cumulative return chart with RISK_OFF bands</li>
              <li>Sleeve YTD return contribution</li>
              <li>Current top holdings with effective weights</li>
              <li>This week's rebalance activity</li>
              <li>Forward-looking signal-threshold watch list</li>
            </ul>
            <p>Live dashboard: <a href="https://phuazz.github.io/breadth-thrust-etf/">phuazz.github.io/breadth-thrust-etf</a></p>
            <p style="color:#6b727a;font-size:11px;">
              Personal research artefact. Not investment advice. Backtest
              performance is not indicative of future returns.
            </p>
          attachments: docs/factsheet_latest.pdf
