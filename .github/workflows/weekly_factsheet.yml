name: Weekly factsheet — verified components + email

# No engines run in the sender. The local refresh seals the exact input book.
# Both stages use the existing full recipient list. Cron may run late;
# calendar policy is rechecked immediately before the SMTP attempt.
on:
  push:
    branches: [main]
    paths: ['data/component_release.json']
  schedule:
    # Sunday 17:00 SGT reconciliation, 18:00 bounded wait, then D checkpoints.
    - cron: '0 9,10,14,18,22 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'No-send rehearsal: validate and render without reserving or emailing'
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: weekly-factsheet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify exact snapshot and prepare message
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/send_component_factsheet.py plan
          else
            python scripts/send_component_factsheet.py plan --reserve
          fi
      - name: Persist reservation before contacting Gmail
        if: steps.plan.outputs.send == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/component_delivery.json
          git commit -m 'Reserve verified component factsheet delivery'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
      - name: Send once to all existing recipients
        if: steps.plan.outputs.send == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/send_component_factsheet.py send
      - name: Persist confirmed delivery
        if: steps.plan.outputs.send == 'true'
        shell: bash
        run: |
          git add docs/component_delivery.json docs/factsheet_published.json
          git commit -m 'Record confirmed component factsheet delivery'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
      - name: Preserve no-send preview or attempted payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-factsheet-preview
          path: .component-mail/*
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Operator-only failure or readiness alert
        if: (failure() || steps.plan.outputs.alert == 'true') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[ACTION REQUIRED] Component factsheet delivery'
          to: ${{ secrets.GMAIL_USER }}
          from: Dashboard Ops
          body: |
            The factsheet needs operator review. Open the run log for the exact failed check.
            An unconfirmed reservation may represent a delivered or partly delivered email.
            Reconcile Gmail delivery before clearing it; do not blindly retry the send.
            No stale or unverified snapshot is authorised for distribution.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
