name: Conflict-marker check

# Fails the build if any tracked file contains an unresolved git
# merge conflict marker (<<<<<<<, >>>>>>>). Backstop for the
# 2026-05-30 hotfix where docs/index.html shipped with stash-pop
# merge markers and the dashboard hung on Loading… for everyone.
#
# Runs fast (~10s), no Python deps beyond the standard library, so
# we run it on every push to main AND on every PR — cheap enough
# that it does not need its own trigger conditions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scan tracked files for conflict markers
        run: python scripts/check_conflict_markers.py
