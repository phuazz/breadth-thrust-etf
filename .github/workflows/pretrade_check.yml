name: Pre-trade readiness check

# WHY A SEPARATE WORKFLOW FROM weekly_factsheet.yml.
#
# Since WS18 (2026-08-22) the book ranks on Friday's close and normally fills
# at Monday's close. The full instruction is built by the Sunday 09:00 SGT local refresh,
# which cannot run in CI because the per-constituent parquet caches are
# gitignored. If the weekend pair does not land, nothing has been built for
# the next order submission.
#
# weekly_factsheet.yml's Sunday check cannot cover this. It asks whether the
# WEEK's factsheet went out, which is a reconciliation question answered two
# days AFTER the fill, and it is built on week_final_anchor, which mid-week
# points at the previous week by design. Detecting a miss and preventing one are
# different jobs and need different questions.
#
# This one asks: does the committed panel reach the session today's decision
# reads? The test is imported from scheduled_refresh.panel_is_current, the same
# function the local wrapper uses to decide whether to push, so the two cannot
# drift apart.

on:
  schedule:
    # Sunday 06:00 UTC = 14:00 SGT. The local full-book refresh starts at
    # 09:00 SGT and has a documented ~4.3-hour cold-run allowance, so this is
    # the earliest independent review point with a margin. It is also before
    # Monday's Xetra order-submission deadline even under the observed GitHub
    # cron-delay tail.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas_market_calendars

      # continue-on-error so a checker fault cannot fail the job silently and
      # suppress the email; the script itself always exits 0 and sets
      # warn=true on any internal error, failing toward alerting.
      - name: Check pre-trade readiness
        id: pretrade
        continue-on-error: true
        run: python scripts/check_pretrade_ready.py

      - name: Email the operator when no instruction has been built
        if: steps.pretrade.outputs.warn == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[${{ steps.pretrade.outputs.tag }}] Next fill — ${{ steps.pretrade.outputs.summary }}'
          # Operator only, NOT RECIPIENT_EMAIL — the factsheet distribution
          # list must not receive plumbing email.
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.pretrade.outputs.detail }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
