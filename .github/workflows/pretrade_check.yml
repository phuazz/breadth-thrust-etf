name: Pre-trade readiness check

# WHY A SEPARATE WORKFLOW FROM weekly_factsheet.yml.
#
# Since WS18 (2026-08-22) the book ranks on Friday's close and normally fills
# at Monday's close. The weekend local refresh pair builds the instruction;
# the Sunday 09:00 SGT run attempts to capture the settled European close.
# Vendor availability and successful completion are checked, not assumed.
# These refreshes cannot run in CI because the per-constituent parquet caches are
# gitignored. If the weekend pair does not land, nothing has been built for
# the next order submission.
#
# weekly_factsheet.yml's Sunday check cannot cover this. It asks whether the
# WEEK's factsheet went out, which is a reconciliation question answered two
# days AFTER the fill, and it is built on week_final_anchor, which mid-week
# points at the previous week by design. Detecting a miss and preventing one are
# different jobs and need different questions.
#
# This checks the broad-market capture, all four sleeve decisions and their
# fill dates, and every A/D source panel. A current broad-market panel alone
# cannot prove that the complete instruction is ready.

on:
  schedule:
    # Sunday 14:00 SGT: progress only. Catch-up/retry runs can still be active;
    # pending captures and HOLDs are recorded without emailing a failure.
    - cron: '0 6 * * 0'
    # Monday 06:00 SGT: deadline escalation, independent of local success.
    # After the ordinary Sunday retry window plus the 8-hour run allowance.
    # The observed 11.8-hour GitHub delay still leaves time before Xetra orders;
    # this is not a guarantee of scheduler punctuality or vendor availability.
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas_market_calendars

      # continue-on-error so a checker fault cannot fail the job silently and
      # suppress the email; the script itself always exits 0 and sets
      # warn=true on any internal error, failing toward alerting.
      - name: Check pre-trade readiness
        id: pretrade
        continue-on-error: true
        env:
          CHECK_PHASE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * 0' && 'review' || 'deadline' }}
        run: python scripts/check_pretrade_ready.py --phase "$CHECK_PHASE"

      - name: Email actionable readiness or checker failures
        # Missing outputs must alert too (including dependency/setup failures).
        if: ${{ !cancelled() && steps.pretrade.outputs.warn != 'false' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '[${{ steps.pretrade.outputs.tag || ''DATA-ERROR'' }}] Next fill — ${{ steps.pretrade.outputs.summary || ''checker did not produce a result'' }}'
          # Operator only, NOT RECIPIENT_EMAIL — the factsheet distribution
          # list must not receive plumbing email.
          to: ${{ secrets.GMAIL_USER }}
          from: 'Dashboard Ops <${{ secrets.GMAIL_USER }}>'
          body: |
            ${{ steps.pretrade.outputs.detail || 'Readiness is unverified: the checker or its setup failed. Inspect this workflow run.' }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
